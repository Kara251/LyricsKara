<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101024" />
  <title>동경의 잔향 — Echoes of Longing</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='36' fill='none' stroke='%23f4ecc8' stroke-width='7'/><circle cx='50' cy='50' r='7' fill='%23f4ecc8'/></svg>" />
</head>
<body>
  <div id="app">
    <!-- 舞台：WebGL 层 -->
    <canvas id="gl"></canvas>

    <!-- 舞台：文字层（歌词排演的主战场；#ghosts 承载“残响”） -->
    <div id="type-layer">
      <div id="ghosts"></div>
      <div id="lines"></div>
    </div>

    <!-- 舞台：电影层（letterbox / 闪帧 / 黑场幕布） -->
    <div id="cine-layer">
      <div class="bar top"></div>
      <div class="bar bottom"></div>
      <div id="veil"></div>
      <div id="flash"></div>
    </div>

    <!-- 开场演出（#opening 与尘粒层）由 src/opening/opening.js 动态构建 -->

    <!-- 横屏引导：移动端竖屏时遮罩全场并暂停演出 -->
    <div id="rotate-gate" hidden>
      <div class="rotate-inner">
        <span class="rotate-phone" aria-hidden="true"></span>
        <p class="rotate-title">Rotate your device</p>
        <p class="rotate-sub">This performance plays in landscape</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
